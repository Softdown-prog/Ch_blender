name: CH Blender required dependencies migration

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  migrate-required-deps:
    if: github.head_ref == 'migration/ch-blender-required-deps' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: target

      - name: Checkout required CH Blender dependencies from City Horizon
        uses: actions/checkout@v4
        with:
          repository: Softdown-prog/City-horizon-
          ref: main
          path: source
          sparse-checkout: |
            tools/tycoon_photo_studio
            .github/actions/setup-ch-blender
          sparse-checkout-cone-mode: false

      - name: Copy required render studio and Blender setup action
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/tools/tycoon_photo_studio target/.github/actions/setup-ch-blender
          rsync -a --delete source/tools/tycoon_photo_studio/ target/tools/tycoon_photo_studio/
          rsync -a --delete source/.github/actions/setup-ch-blender/ target/.github/actions/setup-ch-blender/

      - name: Record standalone dependency boundary
        shell: bash
        run: |
          cat > target/DEPENDENCIES.md <<'EOF'
          # CH Blender standalone dependencies

          ## Required and included

          - `tools/ch_blender/` — orchestration, contracts, quality gates, jobs and tests.
          - `tools/tycoon_photo_studio/` — canonical Blender scene builders, studio presets,
            render pipelines, post-processing and package validation used directly by CH Blender.
          - `tools/blender_bake_runner.py` — bake orchestration compatibility entrypoint.
          - `.github/actions/setup-ch-blender/` — pinned Blender 4.2.3 setup/cache action retained
            as part of the tool contract.

          ## Intentionally not activated during migration

          The old City Horizon CH Blender worker workflows are not copied as active workflows.
          They currently target GitHub-hosted `ubuntu-latest` runners and some optional job
          families reference game-repository helpers such as Character Forge and animation preview.

          The standalone repository should receive a dedicated Windows self-hosted workflow next,
          so expensive Blender execution runs on the owner's PC instead of GitHub-hosted compute.

          ## Runtime boundary

          CH Blender generates and validates production assets. Direct City Horizon runtime
          mutation bridges remain outside this repository. Promotion into the game happens only
          after visual and contract approval.
          EOF

          cat > target/MIGRATION_SCOPE.md <<'EOF'
          # CH Blender standalone migration

          CH Blender was migrated from `Softdown-prog/City-horizon-` so asset production can
          run independently from the game repository.

          ## Included

          - `tools/ch_blender/`: CLI, workers, contracts, preflight profiles, authoring tools,
            scripts, tests, jobs and production recipes/data.
          - `tools/tycoon_photo_studio/`: required canonical render studio, builders, presets,
            contracts, render pipelines, post-processing and validators.
          - `tools/blender_bake_runner.py`: Blender bake orchestration.
          - `.github/actions/setup-ch-blender/`: pinned Blender setup/cache action.
          - `docs/`: CH Blender and directly related asset/render/camera/authoring documentation
            selected from City Horizon.

          ## Deliberately excluded

          These bridges write directly into City Horizon runtime state and are intentionally not
          part of the standalone production repository:

          - `tools/ch_blender/runtime_integrations/`
          - `tools/ch_blender/runtime_promotions/`
          - `tools/ch_blender/integrate_ice_cream_runtime.py`

          Legacy active CH Blender workflows from City Horizon are also not copied unchanged,
          because they use GitHub-hosted Linux runners. The standalone worker will be configured
          for a Windows self-hosted runner separately.

          Approved outputs should be promoted to City Horizon only after visual and contract
          validation.
          EOF

      - name: Commit required dependencies
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tycoon_photo_studio .github/actions/setup-ch-blender DEPENDENCIES.md MIGRATION_SCOPE.md
          if git diff --cached --quiet; then
            echo "No dependency migration changes to commit."
            exit 0
          fi
          git commit -m "feat: migrate CH Blender render dependencies"
          git push origin HEAD:${{ github.head_ref }}
