name: CH Blender - Windows Self-Hosted

on:
  workflow_dispatch:
    inputs:
      command:
        description: "CH Blender command to execute after validation (optional)"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/ch-blender-windows.yml"

permissions:
  contents: read

concurrency:
  group: ch-blender-windows
  cancel-in-progress: true

jobs:
  ch-blender:
    name: CH Blender / Windows
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout CH Blender
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Runner diagnostics
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          git --version

      - name: Resolve Python
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command py -ErrorAction SilentlyContinue }
          if (-not $python) { throw "Python was not found on PATH." }
          & $python.Source --version

      - name: Provision CH Blender 4.2.3 LTS portable
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $version = "4.2.3"
          $series = "4.2"
          $root = Join-Path $env:USERPROFILE ".ch-blender"
          $installDir = Join-Path $root "blender-$version-windows-x64"
          $blenderExe = Join-Path $installDir "blender.exe"
          $zipPath = Join-Path $root "blender-$version-windows-x64.zip"
          $url = "https://download.blender.org/release/Blender$series/blender-$version-windows-x64.zip"

          New-Item -ItemType Directory -Force -Path $root | Out-Null

          function Test-BlenderZip([string]$path) {
            if (-not (Test-Path $path)) { return $false }
            try {
              $archive = [System.IO.Compression.ZipFile]::OpenRead($path)
              $entryCount = $archive.Entries.Count
              $archive.Dispose()
              if ($entryCount -lt 1) { return $false }
              Write-Host "Portable Blender ZIP validated ($entryCount entries)."
              return $true
            } catch {
              Write-Host "Existing ZIP is partial or invalid; download will resume when possible."
              return $false
            }
          }

          if (-not (Test-Path $blenderExe)) {
            $curl = Get-Command curl.exe -ErrorAction SilentlyContinue
            if (-not $curl) { throw "curl.exe was not found on this Windows runner." }

            $archiveReady = Test-BlenderZip $zipPath
            for ($attempt = 1; $attempt -le 2 -and -not $archiveReady; $attempt++) {
              Write-Host "Downloading Blender $version ZIP (attempt $attempt/2; max 15 minutes; resume enabled)..."

              & $curl.Source `
                --location `
                --fail `
                --show-error `
                --connect-timeout 20 `
                --max-time 900 `
                --retry 2 `
                --retry-delay 5 `
                --retry-max-time 900 `
                --retry-all-errors `
                --speed-time 90 `
                --speed-limit 1024 `
                --continue-at - `
                --output $zipPath `
                $url

              $curlExit = $LASTEXITCODE
              if ($curlExit -ne 0) {
                Write-Warning "Download attempt ended with curl exit code $curlExit. Partial ZIP was preserved for resume."
                Start-Sleep -Seconds 5
                continue
              }

              $archiveReady = Test-BlenderZip $zipPath
              if (-not $archiveReady) {
                Write-Warning "Download completed but ZIP validation failed. Removing corrupt archive before final retry."
                Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
              }
            }

            if (-not $archiveReady) {
              throw "Could not obtain a valid Blender $version portable ZIP within the bounded download window. Re-run the workflow to resume/retry."
            }

            if (Test-Path $installDir) {
              Remove-Item $installDir -Recurse -Force
            }
            Write-Host "Extracting Blender $version portable..."
            Expand-Archive -Path $zipPath -DestinationPath $root -Force
          } else {
            Write-Host "Using cached CH Blender baseline at $blenderExe"
          }

          if (-not (Test-Path $blenderExe)) {
            throw "Blender $version portable provisioning failed: $blenderExe was not found."
          }

          Write-Host "CH Blender executable: $blenderExe"
          & $blenderExe --version
          if ($LASTEXITCODE -ne 0) {
            throw "Blender $version failed its version probe."
          }
          "BLENDER_EXE=$blenderExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CH_BLENDER_EXE=$blenderExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate CH Blender repository
        run: |
          $required = @(
            "tools/ch_blender",
            "tools/tycoon_photo_studio",
            "tools/blender_bake_runner.py"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required CH Blender path missing: $path" }
          }
          Write-Host "CH Blender standalone dependencies are present."

      - name: Run CH Blender command
        if: ${{ inputs.command != '' }}
        env:
          CH_COMMAND: ${{ inputs.command }}
        run: |
          Write-Host "Executing CH Blender job on self-hosted Windows runner..."
          Invoke-Expression $env:CH_COMMAND

      - name: Inventory generated outputs
        if: always()
        run: |
          $candidateDirs = @("out", "output", "outputs", "artifacts", "build", "renders")
          foreach ($dir in $candidateDirs) {
            if (Test-Path $dir) {
              Write-Host "Output directory: $dir"
              Get-ChildItem $dir -Recurse -File | Select-Object -First 300 FullName, Length
            }
          }
