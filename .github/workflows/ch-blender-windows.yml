name: CH Blender - Windows Self-Hosted

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: "Repository-relative CH_BLENDER_AGENT_JOB_V1 JSON path (optional)"
        required: false
        type: string
        default: ""
      pool_size:
        description: "Concurrent CH Blender workers (1-8)"
        required: false
        type: string
        default: "2"
      command:
        description: "CH Blender command to execute after validation (optional)"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/ch-blender-windows.yml"
      - "tools/ch_blender/jobs/*.job.json"

permissions:
  contents: read

concurrency:
  group: ch-blender-windows
  cancel-in-progress: true

jobs:
  ch-blender:
    name: CH Blender / Windows
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      CH_BLENDER_POOL_SIZE: ${{ inputs.pool_size || '2' }}
      PYTHONPATH: ${{ github.workspace }}/tools/tycoon_photo_studio

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout CH Blender
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 2

      - name: Runner diagnostics
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          git --version

      - name: Resolve Python
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command py -ErrorAction SilentlyContinue }
          if (-not $python) { throw "Python was not found on PATH." }
          & $python.Source --version
          "CH_PYTHON=$($python.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Discover requested agent jobs
        id: jobs
        env:
          REQUESTED_JOB: ${{ inputs.job_path }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = "Stop"
          $jobsFile = Join-Path $env:RUNNER_TEMP "ch_blender_jobs.txt"
          $jobs = @()

          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            if ($env:REQUESTED_JOB) { $jobs += $env:REQUESTED_JOB.Trim() }
          } else {
            $before = $env:EVENT_BEFORE
            if (-not $before -or $before -match '^0+$') {
              $jobs += @(git diff-tree --no-commit-id --name-only --diff-filter=ACMR -r $env:GITHUB_SHA -- "tools/ch_blender/jobs/*.job.json")
            } else {
              git cat-file -e "$before^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0) { git fetch --no-tags --depth=1 origin $before }
              $jobs += @(git diff --name-only --diff-filter=ACMR $before $env:GITHUB_SHA -- "tools/ch_blender/jobs/*.job.json")
            }
          }

          $jobs = @($jobs | ForEach-Object { $_.Trim() } | Where-Object { $_ } | Sort-Object -Unique)
          foreach ($job in $jobs) {
            if ($job -notlike "tools/ch_blender/jobs/*.job.json") { throw "Rejected agent job path: $job" }
            if (-not (Test-Path -LiteralPath $job -PathType Leaf)) { throw "Agent job does not exist: $job" }
          }
          Set-Content -LiteralPath $jobsFile -Value $jobs -Encoding utf8

          if ($jobs.Count -eq 0) {
            "has-jobs=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "No active CH Blender jobs selected."
          } else {
            "has-jobs=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "jobs-file=$jobsFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Jobs selected:"
            $jobs | ForEach-Object { Write-Host "  $_" }
          }

      - name: Validate jobs before Blender startup
        if: steps.jobs.outputs.has-jobs == 'true'
        run: |
          $ErrorActionPreference = "Continue"
          $failed = $false
          New-Item -ItemType Directory -Force -Path "out/ch_blender_agent/reports" | Out-Null
          foreach ($job in Get-Content -LiteralPath "${{ steps.jobs.outputs.jobs-file }}") {
            $job = $job.Trim()
            if (-not $job) { continue }
            $safe = [IO.Path]::GetFileNameWithoutExtension([IO.Path]::GetFileNameWithoutExtension($job)) -replace '[^A-Za-z0-9._-]', ''
            & $env:CH_PYTHON tools/ch_blender/ch_blender_cli.py validate-job --job $job --report "out/ch_blender_agent/reports/$safe.validation.json"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw "One or more CH Blender jobs failed validation." }

      - name: Resolve local CH Blender 4.2.3 LTS
        if: steps.jobs.outputs.has-jobs == 'true' || inputs.command != ''
        run: |
          $ErrorActionPreference = "Stop"
          . ./tools/ch_blender/legacy_cpu/resolve_blender.ps1
          $resolved = Resolve-CHBlender
          Write-Host "CH Blender executable: $($resolved.Executable)"
          Write-Host "Backend: $($resolved.Backend)"
          Write-Host $resolved.VersionText
          "BLENDER_EXE=$($resolved.Executable)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CH_BLENDER_EXE=$($resolved.Executable)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CH_BLENDER_BACKEND=$($resolved.Backend)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate CH Blender repository
        run: |
          $required = @(
            "tools/ch_blender",
            "tools/ch_blender/worker_pool.py",
            "tools/tycoon_photo_studio",
            "tools/blender_bake_runner.py"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required CH Blender path missing: $path" }
          }
          Write-Host "CH Blender standalone dependencies are present."

      - name: Validate CH Blender agent interface
        if: steps.jobs.outputs.has-jobs == 'true'
        run: |
          & $env:CH_PYTHON tools/ch_blender/ch_blender_cli.py doctor --report out/ch_blender_agent/doctor.json
          if ($LASTEXITCODE -ne 0) { throw "CH Blender doctor failed." }
          & $env:CH_PYTHON tools/ch_blender/ch_blender_cli.py print-contract | Out-File -FilePath out/ch_blender_agent/contract.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "CH Blender contract export failed." }

      - name: Execute deterministic worker pool
        if: steps.jobs.outputs.has-jobs == 'true'
        run: |
          & $env:CH_PYTHON tools/ch_blender/worker_pool.py `
            --jobs-file "${{ steps.jobs.outputs.jobs-file }}" `
            --workers "$env:CH_BLENDER_POOL_SIZE" `
            --blender "$env:CH_BLENDER_EXE" `
            --reports-dir out/ch_blender_agent/reports `
            --report out/ch_blender_agent/pool_report.json
          if ($LASTEXITCODE -ne 0) { throw "CH Blender worker pool failed." }

      - name: Run CH Blender command
        if: ${{ inputs.command != '' }}
        env:
          CH_COMMAND: ${{ inputs.command }}
        run: |
          Write-Host "Executing CH Blender command on self-hosted Windows runner..."
          Invoke-Expression $env:CH_COMMAND

      - name: Inventory generated outputs
        if: always()
        run: |
          $candidateDirs = @("out", "output", "outputs", "artifacts", "build", "renders")
          foreach ($dir in $candidateDirs) {
            if (Test-Path $dir) {
              Write-Host "Output directory: $dir"
              Get-ChildItem $dir -Recurse -File | Select-Object -First 300 FullName, Length
            }
          }

      - name: Upload CH Blender outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CH-Blender-Windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/ch_blender_agent
          if-no-files-found: warn
          retention-days: 14
