name: CH Blender - Windows Self-Hosted

on:
  workflow_dispatch:
    inputs:
      command:
        description: "CH Blender command to execute after validation (optional)"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/ch-blender-windows.yml"

permissions:
  contents: read

concurrency:
  group: ch-blender-windows
  cancel-in-progress: true

jobs:
  ch-blender:
    name: CH Blender / Windows
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout CH Blender
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Runner diagnostics
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          git --version

      - name: Resolve Python
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command py -ErrorAction SilentlyContinue }
          if (-not $python) { throw "Python was not found on PATH." }
          & $python.Source --version

      - name: Resolve local CH Blender 4.2.3 LTS
        run: |
          $ErrorActionPreference = "Stop"
          $expectedVersion = "4.2.3"
          $preferred = Join-Path $env:USERPROFILE ".ch-blender\blender-4.2.3-windows-x64\blender.exe"
          $candidates = @($preferred)

          $pathBlender = Get-Command blender.exe -ErrorAction SilentlyContinue
          if ($pathBlender) { $candidates += $pathBlender.Source }

          $candidates += @(
            "$env:ProgramFiles\Blender Foundation\Blender 4.2\blender.exe"
          )

          $blenderExe = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if (-not (Test-Path $candidate)) { continue }
            $versionText = (& $candidate --version 2>&1 | Select-Object -First 1)
            Write-Host "Candidate: $candidate -> $versionText"
            if ($versionText -match "Blender\s+4\.2\.3") {
              $blenderExe = $candidate
              break
            }
          }

          if (-not $blenderExe) {
            throw "Blender 4.2.3 LTS was not found locally. Install/extract the official portable ZIP to $preferred, then re-run this workflow. GitHub Actions no longer downloads Blender."
          }

          Write-Host "CH Blender executable: $blenderExe"
          & $blenderExe --version
          "BLENDER_EXE=$blenderExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CH_BLENDER_EXE=$blenderExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate CH Blender repository
        run: |
          $required = @(
            "tools/ch_blender",
            "tools/tycoon_photo_studio",
            "tools/blender_bake_runner.py"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required CH Blender path missing: $path" }
          }
          Write-Host "CH Blender standalone dependencies are present."

      - name: Run CH Blender command
        if: ${{ inputs.command != '' }}
        env:
          CH_COMMAND: ${{ inputs.command }}
        run: |
          Write-Host "Executing CH Blender job on self-hosted Windows runner..."
          Invoke-Expression $env:CH_COMMAND

      - name: Inventory generated outputs
        if: always()
        run: |
          $candidateDirs = @("out", "output", "outputs", "artifacts", "build", "renders")
          foreach ($dir in $candidateDirs) {
            if (Test-Path $dir) {
              Write-Host "Output directory: $dir"
              Get-ChildItem $dir -Recurse -File | Select-Object -First 300 FullName, Length
            }
          }
